name: Publish APK Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Test and build installable APK
        env:
          ORG_GRADLE_PROJECT_AMAP_KEY: ${{ secrets.AMAP_KEY }}
          ORG_GRADLE_PROJECT_API_BASE_URL: ${{ vars.API_BASE_URL || 'https://niutrip.gyberpunk123.asia/api/' }}
          ORG_GRADLE_PROJECT_SHARE_BASE_URL: ${{ vars.SHARE_BASE_URL || 'https://niutrip.gyberpunk123.asia' }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Prepare release asset
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "NiuTrip-${GITHUB_REF_NAME}.apk"
          sha256sum "NiuTrip-${GITHUB_REF_NAME}.apk" > "NiuTrip-${GITHUB_REF_NAME}.apk.sha256"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "NiuTrip-${GITHUB_REF_NAME}.apk" \
            "NiuTrip-${GITHUB_REF_NAME}.apk.sha256" \
            --title "NiuTrip ${GITHUB_REF_NAME}" \
            --generate-notes
